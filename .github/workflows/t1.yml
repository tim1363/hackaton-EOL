name: T1 smoke check

on:
  push:
    branches: [main]
    paths:
      - 'stages/T1/**'
      - '.gitattributes'
      - '.github/workflows/t1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build the linux/amd64 image
        run: docker buildx build --platform linux/amd64 --load -t robohack-participant:t1 stages/T1
      - name: Verify the image offline
        run: python3 stages/T1/verify_t1.py robohack-participant:t1
