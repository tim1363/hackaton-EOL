name: T2 build for submission

on:
  push:
    branches: [main]
    paths:
      - 'stages/T2/**'
      - '.github/workflows/t2-submission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t2:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE: eol-t2:local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build T2 for linux/amd64
        run: docker buildx build --platform linux/amd64 --load -f stages/T2/Dockerfile -t "$IMAGE" .
      - name: Verify ping and ROS offline as non-root
        run: bash stages/T2/test_image.sh "$IMAGE"
      - name: Export the verified image
        run: docker save "$IMAGE" | gzip -1 > eol-t2.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: eol-t2-image
          path: eol-t2.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Show the exact source commit
        run: |
          printf 'Source: %s/%s/commit/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
